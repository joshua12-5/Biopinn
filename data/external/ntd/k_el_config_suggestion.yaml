# Data-derived values generated by scripts/adapt_ntd.py (Nano-Tumor Database 2023).
# These are what configs/default_config.yaml and configs/experiment_ntd.yaml use
# (rounded); regenerate and compare if the NTD input or the fit filters change.
dataset:
  parameter_ranges:
    d_NP_nm: [10, 200]                  # NTD in-scope HD diameters: median 103 nm (n=152)
    k_el_per_hr: [0.0136, 0.3810]   # NTD blood/plasma mono-exp fits over 0-72 h, 5th-95th pct (median 0.0684)
model:
  input_dim: 8                           # r, t, R, d_NP, C0, k_d, t_max, k_el
paper:
  baseline:
    k_el_per_hr: 0.0684               # NTD median
